name: Build Windows EXE

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "AIIS_KUE_Error_Calc" app.py

      - name: Verify build artifact exists
        shell: pwsh
        run: |
          if (Test-Path "dist/AIIS_KUE_Error_Calc.exe") {
              $size = (Get-Item "dist/AIIS_KUE_Error_Calc.exe").Length / 1MB
              Write-Host "Build succeeded: dist/AIIS_KUE_Error_Calc.exe ($([math]::Round($size, 2)) MB)"
          } else {
              Write-Error "dist/AIIS_KUE_Error_Calc.exe was not created!"
              exit 1
          }

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIIS_KUE_Error_Calc-Windows-x64
          path: dist/AIIS_KUE_Error_Calc.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AIIS_KUE_Error_Calc.exe
          draft: false
          prerelease: false
          generate_release_notes: true
